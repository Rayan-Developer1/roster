<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>roster-website.vercel.app</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="./Capture.JPG">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { rosterGreen: '#8bc34a', rosterDarkGreen: '#7cb342' },
                    fontFamily: { montserrat: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; color: #333; }
        .container-portfolio { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .header-title { color: #8bc34a; font-size: 36px; font-weight: 900; margin-bottom: 30px; text-transform: uppercase; text-align: center; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .card { background-color: #ffffff; border: 2px solid #e2e8f0; border-radius: 15px; height: 260px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.08); transition: all 0.4s ease; }
        .card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 15px 30px rgba(139, 195, 74, 0.25); border-color: #8bc34a; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .card:hover img { transform: scale(1.08); }
        footer { background-color: #8bc34a; color: white; text-align: center; padding: 25px; font-size: 18px; border-top: 4px solid #7cb342; }
        @media (max-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .cards-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full bg-rosterGreen px-4 sm:px-8 py-4 shadow-lg flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="./Capture.JPG" alt="Roster Logo" class="w-12 h-12 object-contain rounded-xl bg-white p-1 shadow-md">
            <div class="flex flex-col">
                <span class="text-white font-black text-2xl tracking-wider leading-none">ROSTER</span>
                <span class="text-white font-bold text-xs tracking-widest uppercase">WEBSITE.COM</span>
            </div>
        </div>
        <div>
            <a href="index.html" class="bg-white text-gray-900 font-bold px-5 py-2.5 rounded-xl shadow hover:bg-gray-900 hover:text-white transition text-sm flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </header>

    <!-- Main Section - Only Websites -->
    <main class="container-portfolio w-full">
        <h1 class="header-title">My Websites</h1>
        
        <div class="cards-grid">
            <div class="card"><img src="1.jpg" alt="Website 1"></div>
            <div class="card"><img src="7.jpg" alt="Website 2"></div>
            <div class="card"><img src="3.jpg" alt="Website 3"></div>
            <div class="card"><img src="4.jpg" alt="Website 4"></div>
            <div class="card"><img src="5.jpg" alt="Website 5"></div>
            <div class="card"><img src="6.jpg" alt="Website 6"></div>
            <!-- آپ اپنی مزید ویب سائٹس یہاں ایسے ہی نئے کارڈز میں بڑھا سکتے ہیں -->
            <div class="card"><img src="7.jpg" alt="Website 7"></div>
            <div class="card"><img src="11.jpg" alt="Website 8"></div>
            <div class="card"><img src="10.jpg" alt="Website 9"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Roster.Website.com. All Rights Reserved.</p>
    </footer>

</body>
</html>
